<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darslar</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Helvetica, Arial, sans-serif; background: #fff; color: #111; }
  #menu { max-width: 700px; margin: 0 auto; padding: 60px 16px; text-align: center; }
  #menu a { display: block; font-size: 22px; color: #111; text-decoration: none; padding: 8px 0; border-radius: 8px; }
  #menu a:hover { background: #f0f3f8; color: #1a56db; }
  #view { display: none; padding: 16px; }
  #view .top { display: flex; align-items: center; gap: 12px; max-width: 1200px; margin: 0 auto 16px; position: sticky; top: 0; background: #fff; padding: 8px 0; }
  #view button { font-size: 16px; padding: 8px 14px; border: 1px solid #ccc; background: #fff; border-radius: 8px; cursor: pointer; }
  #view h2 { margin: 0; font-size: 20px; }
  #rasmlar { max-width: 1200px; margin: 0 auto; text-align: center; }
  #rasmlar img { max-width: 100%; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 24px; display: block; margin-left: auto; margin-right: auto; }
  #yoq { display: none; color: #888; margin-top: 40px; font-size: 18px; text-align: center; }
</style>
</head>
<body>
  <div id="menu"></div>

  <div id="view">
    <div class="top">
      <button onclick="location.hash=''">← Orqaga</button>
      <h2 id="sarlavha"></h2>
    </div>
    <div id="rasmlar"></div>
    <div id="yoq">Bu mavzu uchun rasm hali yuklanmagan.</div>
  </div>

<script>
  // ===== MENYU =====
  // Har bir mavzu raqami bo'yicha rasm fayllari:
  //   bitta rasm:     2.png
  //   bir nechta:     2-1.png, 2-2.png, 2-3.png ... (tartib bilan)
  var mavzular = [
    "Topshiriq 1",
    "Excelda formula"
  ];
  // Raqamsiz nomlangan eski rasmlar (mavzu raqami: fayl nomi)
  var maxsus = { 1: "Rasm_1.png" };

  var turlar = ["png", "jpg", "jpeg", "PNG", "JPG", "JPEG"];
  var menu = document.getElementById("menu");
  var joy = document.getElementById("rasmlar");
  var yoq = document.getElementById("yoq");
  var sanoq = 0;

  mavzular.forEach(function (nom, i) {
    var a = document.createElement("a");
    a.href = "#" + (i + 1);
    a.textContent = nom;
    menu.appendChild(a);
  });

  // Fayl nomini bir nechta kengaytma bilan sinab ko'radi
  function yukla(asos, tayyor) {
    var k = 0;
    var img = new Image();
    img.onload = function () { tayyor(img); };
    img.onerror = function () {
      k++;
      if (k < turlar.length) img.src = asos + "." + turlar[k];
      else tayyor(null);
    };
    img.src = asos + "." + turlar[0];
  }

  function qosh(img) { img.alt = ""; joy.appendChild(img); }

  function korsat() {
    var n = parseInt(location.hash.slice(1), 10);
    var view = document.getElementById("view");
    sanoq++;
    var meniki = sanoq;
    joy.innerHTML = "";
    yoq.style.display = "none";
    if (!n || n < 1 || n > mavzular.length) {
      view.style.display = "none";
      menu.style.display = "block";
      return;
    }
    menu.style.display = "none";
    view.style.display = "block";
    document.getElementById("sarlavha").textContent = mavzular[n - 1];
    window.scrollTo(0, 0);
    var topildi = 0;

    function oxiri() { if (meniki === sanoq && topildi === 0) yoq.style.display = "block"; }

    // n-1, n-2, n-3 ... ketma-ket, birinchi topilmagan joyda to'xtaydi
    function ketma(i) {
      yukla(n + "-" + i, function (img) {
        if (meniki !== sanoq) return;
        if (img) { qosh(img); topildi++; ketma(i + 1); }
        else oxiri();
      });
    }

    function boshla() {
      // bitta rasm: n.png
      yukla(String(n), function (img) {
        if (meniki !== sanoq) return;
        if (img) { qosh(img); topildi++; }
        ketma(1);
      });
    }

    if (maxsus[n]) {
      var m = new Image();
      m.onload = function () { if (meniki === sanoq) { qosh(m); topildi++; } boshla(); };
      m.onerror = function () { boshla(); };
      m.src = maxsus[n];
    } else {
      boshla();
    }
  }
  window.addEventListener("hashchange", korsat);
  korsat();
</script>
</body>
</html>
