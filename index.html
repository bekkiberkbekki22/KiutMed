<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasmlarim</title>
<style>
  body { margin: 0; font-family: -apple-system, Helvetica, Arial, sans-serif; background: #f5f5f5; color: #222; }
  h1 { text-align: center; padding: 24px 16px 8px; margin: 0; font-size: 28px; }
  .galereya { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .galereya a { display: block; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); text-decoration: none; color: #555; }
  .galereya img { width: 100%; display: block; }
  .galereya span { display: block; padding: 8px 12px; font-size: 14px; }
</style>
</head>
<body>
  <h1>Rasmlarim</h1>
  <div class="galereya">
    <!-- Yangi rasm qo'shsangiz, quyidagi qatordan nusxa olib, fayl nomini o'zgartiring -->
    <a href="Rasm_1.png" target="_blank"><img src="Rasm_1.png" alt="Rasm_1"><span>Rasm_1.png</span></a>
  </div>
</body>
</html>
